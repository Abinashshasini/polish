<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --line: #e4e4e7;
        --chip: #f4f4f5;
        --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e20;
          --fg: #f2f2f2;
          --muted: #9a9a9a;
          --line: #34343a;
          --chip: #2a2a2e;
          --accent: #818cf8;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font:
          14px -apple-system,
          system-ui,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        -webkit-app-region: drag;
        overflow: hidden;
      }
      button,
      .box {
        -webkit-app-region: no-drag;
      }
      .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .box {
        background: var(--chip);
        border-radius: 8px;
        padding: 10px;
        max-height: 100px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .opt {
        text-align: left;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .opt.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .opt kbd {
        float: right;
        font-size: 11px;
        color: var(--muted);
        font-family: inherit;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
      }
      .btn {
        flex: 1;
        padding: 9px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="label">Your text</div>
    <div class="box" id="original"></div>

    <div id="choose">
      <div class="label" style="margin-bottom: 6px">What should I do?</div>
      <div class="options" id="options"></div>
    </div>

    <div id="loading" class="hidden hint">Polishing…</div>

    <div
      id="result"
      class="hidden"
      style="display: flex; flex-direction: column; gap: 10px; flex: 1"
    >
      <div class="label">Result</div>
      <div class="box" id="output"></div>
      <div class="actions">
        <button class="btn" id="back">Back</button>
        <button class="btn" id="copy">Copy</button>
        <button class="btn primary" id="replace">Replace ⏎</button>
      </div>
    </div>

    <div class="hint">
      ↑↓ choose · Enter run/replace · 1–5 quick pick · Esc close
    </div>

    <script>
      const OPTIONS = [
        { mode: 'spelling', label: 'Fix spelling' },
        { mode: 'grammar', label: 'Fix grammar' },
        { mode: 'casual', label: 'Casual 😊' },
        { mode: 'professional', label: 'Professional 💼' },
        { mode: 'fun', label: 'Fun 🎉' },
      ];

      let text = '',
        result = '',
        active = 0,
        state = 'choose';
      const $ = (id) => document.getElementById(id);

      function renderOptions() {
        $('options').innerHTML = OPTIONS.map(
          (o, i) =>
            `<button class="opt ${i === active ? 'active' : ''}" data-i="${i}">${o.label}<kbd>${i + 1}</kbd></button>`,
        ).join('');
      }

      function setState(s) {
        state = s;
        $('choose').classList.toggle('hidden', s !== 'choose');
        $('loading').classList.toggle('hidden', s !== 'loading');
        $('result').classList.toggle('hidden', s !== 'result');
      }

      async function run(i) {
        if (!text) return;
        active = i;
        setState('loading');
        try {
          result = await window.polish.fix(OPTIONS[i].mode, text);
          $('output').textContent = result;
        } catch (e) {
          result = '';
          $('output').textContent = 'Error: ' + e.message;
        }
        setState('result');
      }

      window.polish.onOpen((data) => {
        text = data.text;
        result = '';
        $('original').textContent =
          text || 'Clipboard is empty. Copy some text first.';
        active = Math.max(
          0,
          OPTIONS.findIndex((o) => o.mode === data.mode),
        );
        renderOptions();
        setState('choose');
      });

      $('options').addEventListener('click', (e) => {
        const btn = e.target.closest('.opt');
        if (btn) run(Number(btn.dataset.i));
      });
      $('back').onclick = () => setState('choose');
      $('copy').onclick = () => result && window.polish.copy(result);
      $('replace').onclick = () => result && window.polish.replace(result);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') return window.polish.close();

        if (state === 'choose') {
          if (/^[1-5]$/.test(e.key)) return run(Number(e.key) - 1);
          if (e.key === 'Enter') return run(active);
          if (e.key === 'ArrowDown' || e.key === 'ArrowRight')
            active = (active + 1) % OPTIONS.length;
          else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft')
            active = (active - 1 + OPTIONS.length) % OPTIONS.length;
          else return;
          renderOptions();
        } else if (state === 'result' && e.key === 'Enter' && result) {
          window.polish.replace(result);
        }
      });
    </script>
  </body>
</html>
