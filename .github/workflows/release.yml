# Push a tag that matches package.json's version to publish installers:
#   npm version patch && git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: --mac # dmg for Apple Silicon and Intel
          - os: windows-latest
            platform: --win # NSIS installer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run check
        if: runner.os != 'Windows' # bash loop; npm runs scripts with cmd.exe on Windows, and the source is identical anyway
      - run: npm test
      - run: npm run build:ui
      - run: npx electron-builder ${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Polish $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ## Download
          - **Mac (Apple Silicon, M1 and newer):** `Polish-*-mac-arm64.dmg`
          - **Mac (Intel):** `Polish-*-mac-x64.dmg`
          - **Windows:** `Polish-Setup-*.exe`

          These builds are not signed with a paid certificate yet:
          - **Mac:** after dragging Polish to Applications, open it once, then go to System Settings → Privacy & Security and click **Open Anyway**.
          - **Windows:** if SmartScreen appears, click **More info → Run anyway**.
          EOF
          )"
